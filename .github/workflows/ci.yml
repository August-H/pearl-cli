name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Windows C compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Configure Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'C:\msys64\ucrt64\bin' | Out-File -FilePath $env:GITHUB_PATH -Append
          'CC=gcc' | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Vet
        run: go vet ./...
      - name: Tests with race detection
        env:
          CGO_ENABLED: '1'
        run: go test -race ./... -timeout 5m
      - name: Build
        run: go build -o test-results/smoke/pearl.exe ./cmd/pearl
      - name: CLI smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./testenv/smoke.ps1 -Binary ./test-results/smoke/pearl.exe
      - name: CLI smoke test (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./testenv/smoke.sh ./test-results/smoke/pearl.exe
